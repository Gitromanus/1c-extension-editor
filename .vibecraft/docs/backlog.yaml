version: 1
tasks:
  - id: task-5701
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения в стиле строгого инструмента
      разработчика с областью загрузки файла расширения.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения: заголовок, описание и кнопку/область выбора файла. Распаковка
      и рабочие экраны на этом этапе не реализуются.
    status: completed
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - На странице есть понятная область для загрузки файла расширения
      - Оформление соответствует строгому инструменту разработчика
    summary: Создана визуальная заглушка главной страницы в стиле строгого
      инструмента разработчика. app/page.tsx отображает заголовок, описание и
      блок возможностей; компонент components/extension-dropzone.tsx
      предоставляет область загрузки файла .cfe (drag&drop и выбор файла с
      валидацией расширения). Распаковка не реализована, при выборе файла
      показывается уведомление. appName обновлён в app/layout.tsx.
  - id: task-5970
    title: Загрузка и распаковка расширения
    description: >-
      Пользователь выбирает файл расширения 1С (.cfe), приложение распаковывает
      его по логике формата v8unpack и переходит к рабочему просмотру
      содержимого.

      Цель: открыть файл расширения и сделать его содержимое доступным для
      работы.
    status: completed
    acceptance_criteria:
      - Файл .cfe успешно распаковывается и его содержимое доступно для просмотра
      - При ошибке или неверном формате показывается понятное сообщение
      - После распаковки открывается рабочий вид содержимого
    summary: "Реализована загрузка и распаковка расширения .cfe в браузере. Логика в
      lib/extension/extract.ts: валидация расширения, проверка ZIP-заголовка по
      логике v8unpack, извлечение через jszip с понятными сообщениями об ошибках
      (CfeFormatError). components/extension-dropzone.tsx выполняет распаковку и
      переходит к рабочему виду содержимого components/extension-viewer.tsx с
      списком файлов и просмотром текстовых модулей."
  - id: task-6135
    title: Просмотр структуры файлов
    description: >-
      Распакованное содержимое показывается в виде дерева папок и файлов с
      навигацией по ним.

      Цель: пользователь видит файловую структуру расширения и может переходить
      по ней.
    status: completed
    acceptance_criteria:
      - Структура расширения отображается в виде дерева папок и файлов
      - Пользователь может раскрывать папки и переходить к файлам
      - Выбранный файл открывается для просмотра
    summary: Структура расширения теперь отображается в виде раскрывающегося дерева
      папок и файлов. Построение дерева реализовано в lib/extension/tree.ts
      (buildFileTree), рендер с раскрытием/сворачиванием папок и переходом к
      файлам — в components/extension-viewer.tsx (компонент TreeNode). Выбранный
      файл открывается для просмотра в правой панели.
  - id: task-8656
    title: Просмотр и редактирование кода
    description: >-
      Текстовые файлы (модули) открываются в редакторе с просмотром кода и
      возможностью редактирования.

      Цель: пользователь видит код и может вносить правки.
    status: completed
    acceptance_criteria:
      - Текстовые файлы открываются с читаемым кодом
      - Пользователь может вносить и сохранять изменения в код
      - Бинарные/нетекстовые файлы корректно обрабатываются без искажений
    summary: "В components/extension-viewer.tsx добавлено редактирование кода:
      текстовые файлы (модули) открываются в моноширинном редакторе, есть режимы
      просмотр/ редактирование, сохранение правок в архив (source.file) через
      кнопку «Сохранить» или Ctrl+S, отмена изменений и индикация несохранённых
      правок. Бинарные/нетекстовые файлы по-прежнему обрабатываются без
      искажений через readEntryText/looksBinary и открываются только для
      чтения."
  - id: task-9725
    title: Упаковка и скачивание
    description: >-
      Приложение упаковывает текущее содержимое с учётом внесённых правок
      обратно в файл .cfe и предлагает скачать результат.

      Цель: собрать изменённое расширение и получить готовый файл.
    status: completed
    acceptance_criteria:
      - Изменённое расширение упаковывается обратно в .cfe без потери данных
      - Скачанный файл доступен пользователю для использования
    summary: Реализована упаковка и скачивание расширения. Логика упаковки в
      lib/extension/pack.ts (packToBlob на базе JSZip, triggerDownload через
      Blob URL). В components/extension-viewer.tsx добавлена кнопка «Скачать
      .cfe» в заголовке, которая упаковывает текущее содержимое с учётом
      внесённых правок и предлагает скачать файл. Правки сохраняются в тот же
      источник (source.file), поэтому упакованный .cfe не теряет данные.
